# Hyprlock - Crimson Temple lock screen
# Location: ~/.config/hypr/hyprlock.conf

$bg      = rgba(131314ee)
$surface = rgb(1d2224)
$fg      = rgb(d8d4ce)
$muted   = rgb(8a8681)
$accent  = rgb(e9445e)
$wine    = rgb(5c0f2a)
$warn    = rgb(d6a36a)

$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
}

background {
    monitor =
    path = screenshot
    color = $bg
    blur_passes = 3
    blur_size = 8
    brightness = 0.6
}

# Big clock
label {
    monitor =
    text = cmd[update:1000] date +"%I:%M"
    color = $fg
    font_size = 96
    font_family = $font
    position = 0, 180
    halign = center
    valign = center
}

# Date - the red accent, like the sun
label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    color = $accent
    font_size = 20
    font_family = $font
    position = 0, 80
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    rounding = 10

    outer_color = $accent
    inner_color = $bg
    font_color = $fg
    check_color = $warn
    fail_color = $wine

    font_family = $font
    placeholder_text = <span foreground="##8a8681">Password...</span>
    fail_text = <i>$FAIL</i>

    dots_size = 0.25
    dots_spacing = 0.3
    fade_on_empty = false

    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text = Welcome back, $USER
    color = $muted
    font_size = 14
    font_family = $font
    position = 0, -110
    halign = center
    valign = center
}
